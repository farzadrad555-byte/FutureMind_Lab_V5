
<!DOCTYPE html>
<html lang="en">

<head>




<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FutureMind Lab Admin</title>

<style>

body{
font-family:Arial, sans-serif;
padding:30px;
background:#f5f5f5;
}

h1{
color:#222;
}

.cards{
display:flex;
gap:20px;
margin:20px 0;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px #ccc;
min-width:180px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

th{
background:#222;
color:white;
}

td,th{
padding:12px;
border:1px solid #ddd;
}

</style>

</head>


<body>

<h1>FutureMind Lab Admin</h1>

<h2>Sales Dashboard</h2>


<div class="cards">

<div class="card">
<h3>Total Orders</h3>
<p id="total">0</p>
</div>


<div class="card">
<h3>Products Sold</h3>
<p id="products">0</p>
</div>


</div>



<h2>Customer Orders</h2>


<table>

<thead>

<tr>
<th>Name</th>
<th>Email</th>
<th>Product</th>
<th>Date</th>
</tr>

</thead>


<tbody id="orders">

</tbody>

</table>



<script>

fetch("../orders/orders.json")

.then(response=>response.json())

.then(data=>{


document.getElementById("total").innerHTML=data.length;


document.getElementById("products").innerHTML=data.length;



let table=document.getElementById("orders");


data.forEach(order=>{


let row=document.createElement("tr");


row.innerHTML=`

<td>${order.name}</td>

<td>${order.email}</td>

<td>${order.product}</td>

<td>${order.date}</td>

`;


table.appendChild(row);


});


});


</script>


</body>

</html>
